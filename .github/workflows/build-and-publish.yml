name: Build and publish

on:
  push:
    branches:
      - 26.2-neo/fabric
    tags:
      - v1.0.1-26.2
  pull_request:
    branches:
      - 26.2-neo/fabric
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if [[ "$GITHUB_REF_NAME" != "v1.0.1-26.2" ]]; then
            echo "Unexpected release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

      - name: Build and verify
        run: |
          chmod +x gradlew
          ./gradlew clean build
          python scripts/verify_port.py --artifacts

      - name: Upload loader JARs
        uses: actions/upload-artifact@v4
        with:
          name: nether-portal-coordinate-scale-26.2
          if-no-files-found: error
          path: |
            fabric/build/libs/netherportalcoordinatescale-fabric-26.2-1.0.1.jar
            neoforge/build/libs/netherportalcoordinatescale-neoforge-26.2-1.0.1.jar

      - name: Publish Fabric
        if: github.ref == 'refs/tags/v1.0.1-26.2'
        uses: Kira-NT/mc-publish@v3
        with:
          files: fabric/build/libs/netherportalcoordinatescale-fabric-26.2-1.0.1.jar
          name: NPCS 1.0.1 26.2 Fabric
          version: 1.0.1-26.2-fabric
          version-type: release
          changelog: Fix configured portal coordinate scaling on clients and dedicated servers.
          loaders: fabric
          game-versions: 26.2
          game-version-filter: none
          java: 25
          environment: client | server
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-tag: v1.0.1-26.2
          github-name: Nether Portal Coordinate Scale 1.0.1 for Minecraft 26.2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-mode: fail

      - name: Publish NeoForge
        if: github.ref == 'refs/tags/v1.0.1-26.2'
        uses: Kira-NT/mc-publish@v3
        with:
          files: neoforge/build/libs/netherportalcoordinatescale-neoforge-26.2-1.0.1.jar
          name: NPCS 1.0.1 26.2 NeoForge
          version: 1.0.1-26.2-neoforge
          version-type: release
          changelog: Fix configured portal coordinate scaling on clients and dedicated servers.
          loaders: neoforge
          game-versions: 26.2
          game-version-filter: none
          java: 25
          environment: client | server
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-tag: v1.0.1-26.2
          github-name: Nether Portal Coordinate Scale 1.0.1 for Minecraft 26.2
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-mode: fail
