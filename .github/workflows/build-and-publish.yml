name: Build and Publish

on:
  push:
    branches: ["1.20.1-neo/fabric", "1.21.*-neo/fabric"]
    tags: ["v1.0.2-*"]
  pull_request:
    branches: ["1.20.1-neo/fabric", "1.21.*-neo/fabric"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      minecraft: ${{ steps.properties.outputs.minecraft }}
      java: ${{ steps.properties.outputs.java }}
      secondary: ${{ steps.properties.outputs.secondary }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: properties
        shell: bash
        run: |
          set -euo pipefail
          minecraft=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          java=$(sed -n 's/^java_version=//p' gradle.properties)
          version=$(sed -n 's/^version=//p' gradle.properties)
          secondary=$([ -d neoforge ] && echo neoforge || echo forge)
          test "$version" = "1.0.2"
          echo "minecraft=$minecraft" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "secondary=$secondary" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            test "$GITHUB_REF_NAME" = "v1.0.2-$minecraft"
            branch="$minecraft-neo/fabric"
            git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch"
            test "$GITHUB_SHA" = "$(git rev-parse "refs/remotes/origin/$branch")"
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ steps.properties.outputs.java }}
          cache: gradle
      - run: chmod +x gradlew
      - run: python3 scripts/verify_backport.py
      - run: ./gradlew clean build
      - run: python3 scripts/verify_backport.py --artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.properties.outputs.minecraft }}
          path: dist/*.jar
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    env:
      MINECRAFT_VERSION: ${{ needs.validate.outputs.minecraft }}
      SECONDARY_LOADER: ${{ needs.validate.outputs.secondary }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.validate.outputs.minecraft }}
          path: dist
      - name: Require credentials and exact artifacts
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CURSEFORGE_TOKEN"
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$MODRINTH_TOKEN"
          test -n "$MODRINTH_PROJECT_ID"
          test -f "dist/netherportalcoordinatescale-fabric-$MINECRAFT_VERSION-1.0.2.jar"
          test -f "dist/netherportalcoordinatescale-$SECONDARY_LOADER-$MINECRAFT_VERSION-1.0.2.jar"
          test "$(find dist -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 2
      - name: Publish Fabric
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: dist/netherportalcoordinatescale-fabric-${{ env.MINECRAFT_VERSION }}-1.0.2.jar
          name: NPCS 1.0.2 ${{ env.MINECRAFT_VERSION }} Fabric
          version: 1.0.2-${{ env.MINECRAFT_VERSION }}-fabric
          version-type: release
          loaders: fabric
          game-versions: ${{ env.MINECRAFT_VERSION }}
          changelog: Configured coordinate scales are now applied. Dedicated servers now load the coordinate-scale Mixin.
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          fail-mode: fail
      - name: Publish Forge or NeoForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: dist/netherportalcoordinatescale-${{ env.SECONDARY_LOADER }}-${{ env.MINECRAFT_VERSION }}-1.0.2.jar
          name: NPCS 1.0.2 ${{ env.MINECRAFT_VERSION }} ${{ env.SECONDARY_LOADER == 'neoforge' && 'NeoForge' || 'Forge' }}
          version: 1.0.2-${{ env.MINECRAFT_VERSION }}-${{ env.SECONDARY_LOADER }}
          version-type: release
          loaders: ${{ env.SECONDARY_LOADER }}
          game-versions: ${{ env.MINECRAFT_VERSION }}
          changelog: Configured coordinate scales are now applied. Dedicated servers now load the coordinate-scale Mixin.
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.ref_name }}
          fail-mode: fail
