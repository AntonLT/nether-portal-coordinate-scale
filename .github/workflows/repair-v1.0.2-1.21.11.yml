name: Repair v1.0.2-1.21.11 publication

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@v5
        with:
          ref: v1.0.2-1.21.11
          fetch-depth: 0

      - name: Guard release identity and missing destinations
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "6f7a17e9471572f5c7b64680d572931e7c02f5b0"
          grep -qx 'version=1.0.2' gradle.properties
          grep -qx 'minecraft_version=1.21.11' gradle.properties
          grep -qx 'java_version=21' gradle.properties
          test -d fabric
          test -d neoforge
          test ! -d forge

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Rebuild and verify tagged artifacts
        run: |
          set -euo pipefail
          chmod +x gradlew
          python3 scripts/verify_backport.py
          ./gradlew clean build
          python3 scripts/verify_backport.py --artifacts

      - name: Require publication credentials
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          test -n "$CURSEFORGE_TOKEN"
          test -n "$CURSEFORGE_PROJECT_ID"
          test -n "$MODRINTH_TOKEN"
          test -n "$MODRINTH_PROJECT_ID"

      - name: Guard configured marketplace state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          MODRINTH_PROJECT_ID: ${{ secrets.MODRINTH_PROJECT_ID }}
        run: |
          set -euo pipefail
          MODRINTH_VERSIONS=$(curl -fsSL "https://api.modrinth.com/v2/project/$MODRINTH_PROJECT_ID/version")
          test "$(jq '[.[] | select(.version_number == "1.0.2-1.21.11-fabric" or .version_number == "1.0.2-1.21.11-neoforge")] | length' <<<"$MODRINTH_VERSIONS")" = 0

          test "$CURSEFORGE_PROJECT_ID" = "1282016"
          FABRIC_ID=8690943

          if gh release view "v1.0.2-1.21.11" >/dev/null 2>&1; then
            echo 'GitHub release already exists; refusing a duplicate repair'
            exit 1
          fi

          jq -n --argjson fileID "$FABRIC_ID" --arg displayName 'NPCS 1.0.2 1.21.11 Fabric' \
            '{fileID: $fileID, displayName: $displayName}' > curseforge-update.json
          curl --fail-with-body -X POST \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            -F "metadata=<curseforge-update.json" \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/update-file"

      - name: Publish missing Fabric Modrinth version
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: dist/netherportalcoordinatescale-fabric-1.21.11-1.0.2.jar
          name: NPCS 1.0.2 1.21.11 Fabric
          version: 1.0.2-1.21.11-fabric
          version-type: release
          loaders: fabric
          game-versions: 1.21.11
          changelog: Configured coordinate scales are now applied. Dedicated servers now load the coordinate-scale Mixin.
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          fail-mode: fail

      - name: Publish missing NeoForge Modrinth version
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: dist/netherportalcoordinatescale-neoforge-1.21.11-1.0.2.jar
          name: NPCS 1.0.2 1.21.11 NeoForge
          version: 1.0.2-1.21.11-neoforge
          version-type: release
          loaders: neoforge
          game-versions: 1.21.11
          changelog: Configured coordinate scales are now applied. Dedicated servers now load the coordinate-scale Mixin.
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          fail-mode: fail

      - name: Publish missing NeoForge CurseForge file
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          files: dist/netherportalcoordinatescale-neoforge-1.21.11-1.0.2.jar
          name: NPCS 1.0.2 1.21.11 NeoForge
          version: 1.0.2-1.21.11-neoforge
          version-type: release
          loaders: neoforge
          game-versions: 1.21.11
          changelog: Configured coordinate scales are now applied. Dedicated servers now load the coordinate-scale Mixin.
          curseforge-id: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          fail-mode: fail

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.2-1.21.11" \
            dist/netherportalcoordinatescale-fabric-1.21.11-1.0.2.jar \
            dist/netherportalcoordinatescale-neoforge-1.21.11-1.0.2.jar \
            --verify-tag \
            --title "NPCS 1.0.2 1.21.11" \
            --notes "Configured coordinate scales are now applied. Dedicated servers now load the coordinate-scale Mixin."
